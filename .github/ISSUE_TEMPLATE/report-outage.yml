name: Report an outage
description: A repeater or node that has gone quiet. No addresses or owner details.
title: "[outage] "
labels: ["report", "outage"]
body:
  - type: input
    id: name
    attributes: { label: Repeater or node name, placeholder: IN.CTY.name }
    validations: { required: true }
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options: [MeshCore, Meshtastic, GMRS repeater, Ham repeater, Reticulum node]
    validations: { required: true }
  - type: input
    id: since
    attributes: { label: Down since, description: A date and rough time is enough. }
  - type: dropdown
    id: owner
    attributes:
      label: Are you the owner?
      options: ["No, just noticed it", "Yes, I run it"]
  - type: textarea
    id: what
    attributes: { label: "What are you seeing?" }
