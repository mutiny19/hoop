name: Count what you use
description: Tell HOOP which off-grid radio systems you use in Indiana. No names or addresses.
title: "[count] "
labels: ["report", "count"]
body:
  - type: checkboxes
    id: uses
    attributes:
      label: What do you use?
      options:
        - label: GMRS
        - label: Ham radio
        - label: MeshCore
        - label: Meshtastic
        - label: Reticulum
        - label: Something else (name it below)
  - type: input
    id: county
    attributes: { label: County, description: Indiana county only. Please do not post an address. }
    validations: { required: true }
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options: [I use it, I run a repeater or fixed node, I organize a club or group]
  - type: input
    id: count
    attributes: { label: How many radios or nodes }
  - type: input
    id: other
    attributes: { label: Other protocol or project, description: "Its name and official site, if you picked Something else." }
