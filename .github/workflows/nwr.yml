name: Monthly NOAA Weather Radio list

on:
  schedule:
    - cron: "17 10 3 * *"   # the 3rd of each month, early morning in Indiana
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the NWS weather radio coverage list for Indiana
        run: python3 tools/update_nwr.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/nwr-indiana.json; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/nwr-indiana.json
          git commit -m "Monthly NOAA Weather Radio list"
          git pull --rebase origin main
          git push
