name: Weekly NWS zone outlines

on:
  schedule:
    - cron: "41 8 * * 0"   # Sunday, early morning in Indiana
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and simplify the forecast-zone outlines
        run: python3 tools/update_zones.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/nws-zones.json; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/nws-zones.json
          git commit -m "Weekly NWS zone outlines"
          git pull --rebase origin main
          git push
