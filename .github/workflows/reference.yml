name: Yearly county reference data

on:
  schedule:
    - cron: "5 9 15 1 *"   # January 15, after the Census releases new estimates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data/in-counties.json from the Census Bureau
        run: python3 tools/update_reference.py
      - name: Commit if changed
        run: |
          git diff --quiet -- data/in-counties.json && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/in-counties.json && git commit -m "Yearly county reference data" && git push
