name: Publish site

# Publishes the repo root to GitHub Pages. This replaces GitHub's built-in "pages build and deployment" job,
# which needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
# The site has no build step: the files are uploaded as they are.

on:
  push:
    branches: [main]
  # The data workflows commit with GitHub's own token, and GitHub does not start a "push" run for those commits.
  # So publish again whenever one of them finishes; without this, nightly data reaches the repo but never the site.
  workflow_run:
    workflows:
      - "Nightly MeshCore inventory"
      - "#meshnet check-in log"
      - "What's new line"
      - "Weekly ham nets (Indiana Ham Radio open data)"
      - "Weekly observer counts"
      - "Weekly NWS zone outlines"
      - "Weekly source watch"
      - "Monthly NOAA Weather Radio list"
      - "Projects catalogue"
      - "Yearly county reference data"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push matters: a newer run replaces an older one that has not finished.
concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
