name: Publish site

# Publishes the repo root to GitHub Pages. This replaces GitHub's built-in "pages build and deployment" job,
# which needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
# The site has no build step: the files are uploaded as they are.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push matters: a newer run replaces an older one that has not finished.
concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
