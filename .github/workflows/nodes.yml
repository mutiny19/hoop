name: Nightly MeshCore inventory

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC, overnight in Indiana
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update repeaters from the official MeshCore Map feed
        run: python3 tools/update_nodes.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/meshcore-nodes.json; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/meshcore-nodes.json
          git commit -m "Nightly MeshCore inventory"
          git push
