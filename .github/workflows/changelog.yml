name: What's new line

on:
  push:
    branches: [main]
    paths-ignore: ["data/changelog.json", "SOURCES.md", "sitemap.xml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the sitemap dates need the full history
      - run: python3 tools/changelog.py
      - run: python3 tools/make_sources.py   # SOURCES.md, rebuilt from the pages, data, and scripts
      - run: python3 tools/make_sitemap.py   # sitemap.xml, each page dated from its last real change
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/changelog.json SOURCES.md sitemap.xml; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/changelog.json SOURCES.md sitemap.xml
          git commit -m "Update what's new"
          git pull --rebase origin main
          git push
