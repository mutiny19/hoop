name: "#meshnet check-in log"

# Logs the 7:00-7:10 PM Indiana window on net nights (Sundays and Thursdays), and that window alone.
#   EDT (summer): window closes 23:13 UTC Sun/Thu.   EST (winter): window closes 00:13 UTC Mon/Fri.
# GitHub starts this repo's scheduled runs two to ten hours late and drops about half of them. So the schedule
# starts hours before the net, hourly: a run that lands within five hours of the window closing waits inside the
# job until the window is final and logs it then; one that lands earlier, or after the net is logged, does nothing.
# Later runs are the fallback, and the script logs any net that ended in the last 30 hours.
on:
  schedule:
    - cron: "13 14-23 * * 0,4"
    - cron: "13 0-3 * * 1,5"
  workflow_dispatch:
    inputs:
      date:
        description: "Net date to log, YYYY-MM-DD (Sun or Thu; only while the source still holds it, about a day)"
        required: false
      so_far:
        description: "Mid-net snapshot: log the check-ins heard so far (only while the net is on)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: meshnet-log-${{ github.event_name }}   # a run started by hand never queues behind a scheduled run that is waiting
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography tzdata
      - name: Log the #meshnet window from community observers
        env:
          DATE: ${{ github.event.inputs.date }}
          SO_FAR: ${{ github.event.inputs.so_far }}
        run: |
          if [ "$SO_FAR" = "true" ]; then python3 tools/meshnet_log.py --so-far
          elif [ -n "$DATE" ]; then python3 tools/meshnet_log.py --date "$DATE"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then python3 tools/meshnet_log.py --wait
          else python3 tools/meshnet_log.py; fi
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/meshnet)" ]; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/meshnet/log.json
          git commit -m "#meshnet check-in log"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
